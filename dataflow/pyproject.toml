[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shopstream-dataflow"
version = "0.1.0"
description = "Apache Beam streaming pipeline for the ShopStream Data Platform"
requires-python = ">=3.11"

dependencies = [
    "apache-beam[gcp]==2.75.0",
    "pydantic>=2,<3",
]

[tool.setuptools.packages.find]
where = ["src"]