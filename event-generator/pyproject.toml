[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shopstream-event-generator"
version = "0.1.0"
description = "Synthetic e-commerce event generator for the ShopStream Data Platform"
requires-python = ">=3.11"

dependencies = [
    "pydantic",
    "google-cloud-pubsub",
]

[tool.setuptools.packages.find]
where = ["src"]