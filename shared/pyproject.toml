[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shopstream-common"
version = "0.1.0"
description = "Shared models and utilities for the ShopStream Data Platform"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2,<3"
]

[tool.setuptools.packages.find]
where = ["."]